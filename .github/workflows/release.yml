name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: bash mac/build.sh
      - name: Package app
        run: ditto -c -k --keepParent dist/BabyLock.app dist/BabyLock-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BabyLock-macOS-universal
          path: dist/BabyLock-macOS-universal.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    strategy:
      matrix:
        architecture: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build self-contained executable
        run: dotnet publish windows/BabyLock.csproj -c Release -r ${{ matrix.architecture }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/${{ matrix.architecture }}
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path dist/${{ matrix.architecture }}/BabyLock.exe -DestinationPath dist/BabyLock-${{ matrix.architecture }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BabyLock-${{ matrix.architecture }}
          path: dist/BabyLock-${{ matrix.architecture }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BabyLock-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --repo "${GITHUB_REPOSITORY}" --title "BabyLock ${GITHUB_REF_NAME}" --generate-notes
